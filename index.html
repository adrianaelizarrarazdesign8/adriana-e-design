<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Adriana E Design | Visual Designer</title>
		<meta name="description" content="Adriana E Design is a visual design portfolio for brands, culture, and curious ideas.">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Josefin+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
	<style>
		:root {
			--ink: #17262b;
			--paper: #e8dfcf;
			--cream: #f8f3e9;
			--blue: #1d3e50;
			--gold: #c6a77b;
			--line: rgba(23, 38, 43, .2);
			--mono: "DM Mono", monospace;
			--sans: "Manrope", sans-serif;
			--serif: "Josefin Sans", sans-serif;
		}

		* { box-sizing: border-box; }
		html { scroll-behavior: smooth; }
		body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--sans); font-weight: 500; line-height: 1.6; }
		a { color: inherit; text-decoration: none; }
		img { display: block; width: 100%; object-fit: cover; }
		button { color: inherit; font: inherit; }

		.site-header { align-items: center; background-color: var(--blue); background-image: linear-gradient(rgba(29, 62, 80, .96), rgba(29, 62, 80, .96)), url("images/Final projects photos/texture image background.jpg"); background-repeat: repeat; background-size: auto, 115px 115px; border-bottom: 1px solid rgba(23, 38, 43, 0.18); display: flex; flex-direction: row; gap: 24px; justify-content: space-between; margin: 0 auto; max-width: 1480px; padding: 20px 5vw 18px; width: 100%; }
		.wordmark { align-items: center; display: flex; justify-content: center; margin: 0; max-width: 320px; min-width: 180px; transform: translateY(-2px); width: clamp(240px, 26vw, 340px); }
		.brand-logo { display: block; height: auto; margin: 0 auto; max-height: 110px; object-fit: contain; width: auto; }
		.nav { align-items: center; display: flex; flex-wrap: wrap; font-family: var(--mono); font-size: clamp(9px, .7vw, 11px); gap: 34px; justify-content: flex-end; letter-spacing: .22em; margin: 0; text-transform: uppercase; }
		.nav a { color: rgba(248, 243, 233, 0.9); letter-spacing: .14em; padding: 8px 0 6px; position: relative; transition: color .2s ease, opacity .2s ease; }
		.nav a::after { background: var(--gold); bottom: 0; content: ""; height: 1px; left: 0; position: absolute; transform: scaleX(0); transform-origin: center; transition: transform .2s ease; width: 100%; }
		.nav a:hover::after, .nav a.current::after { transform: scaleX(1); }
		.nav a:hover, .nav a.current { color: var(--cream); }

		.hero { background-color: var(--paper); background-image: linear-gradient(rgba(232, 223, 207, .86), rgba(232, 223, 207, .86)), url("images/Final projects photos/texture image background.jpg"); background-repeat: repeat; background-size: auto, 115px 115px; min-height: 71vh; padding: 9vh 5vw 7vh; position: relative; }
		.eyebrow, .section-label { color: var(--blue); font-family: var(--mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; }
		.hero h1 { font-family: var(--serif); font-size: clamp(58px, 9.3vw, 142px); font-weight: 600; letter-spacing: -.055em; line-height: .87; margin: 24px 0 42px; max-width: 960px; }
		.hero h1 em { color: var(--blue); font-style: italic; }
		.hero-bottom { align-items: end; display: flex; justify-content: space-between; gap: 28px; }
		.hero-intro { font-size: 16px; line-height: 1.55; font-weight: 500; max-width: 430px; }
		.hero-links { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; justify-content: flex-end; }
		.hero-links .text-link { border-bottom: 1px solid var(--ink); display: inline-block; font-family: var(--mono); font-size: 11px; padding-bottom: 5px; text-transform: uppercase; }
		.scroll-note { align-items: center; display: flex; font-family: var(--mono); font-size: 10px; gap: 12px; text-transform: uppercase; }
		.scroll-note::before { background: var(--ink); content: ""; height: 1px; width: 48px; }

		.work { background: var(--cream); padding: 92px 5vw 110px; }
		.section-heading { align-items: end; display: flex; justify-content: space-between; margin-bottom: 34px; }
		.section-heading h2 { font-family: var(--serif); font-size: clamp(40px, 5vw, 72px); font-weight: 600; letter-spacing: -.05em; line-height: .95; margin: 10px 0 0; }
		.filters { display: flex; flex-wrap: wrap; gap: 8px; justify-content: end; }
		.filter { background: transparent; border: 1px solid var(--line); border-radius: 100px; cursor: pointer; font-family: var(--mono); font-size: 10px; padding: 9px 14px; text-transform: uppercase; transition: background .2s ease, color .2s ease; }
		.filter:hover, .filter.active { background: var(--ink); color: var(--cream); }
		.project-grid { display: grid; gap: 42px 20px; grid-template-columns: repeat(12, 1fr); }
		.project { cursor: pointer; grid-column: span 4; }
		.project:nth-child(2), .project:nth-child(5) { grid-column: span 8; }
		.project:nth-child(3), .project:nth-child(6) { grid-column: span 4; }
		.project-image { background: var(--paper); overflow: hidden; }
		.project:nth-child(1) .project-image, .project:nth-child(4) .project-image { aspect-ratio: 4 / 5; }
		.project:nth-child(2) .project-image, .project:nth-child(5) .project-image { aspect-ratio: 16 / 9; }
		.project:nth-child(3) .project-image, .project:nth-child(6) .project-image { aspect-ratio: 1 / 1; }
		.project-image img { height: 100%; object-fit: contain; transition: transform .55s cubic-bezier(.2,.7,.2,1); }
		.project:hover .project-image img { transform: scale(1.045); }
		.project-meta { align-items: start; display: flex; justify-content: space-between; padding-top: 13px; }
		.project-title { font-family: var(--serif); font-size: 24px; font-weight: 600; line-height: 1; }
		.project-type { font-family: var(--mono); font-size: 10px; letter-spacing: .04em; margin-top: 5px; text-align: right; text-transform: uppercase; }
		.project.is-hidden { display: none; }

		.about { background: var(--gold); display: grid; gap: 10vw; grid-template-columns: 1fr 1fr; padding: 105px 5vw; }
		.about h2 { font-family: var(--serif); font-size: clamp(44px, 6vw, 84px); font-weight: 600; letter-spacing: -.06em; line-height: .92; margin: 8px 0 0; }
		.about-copy { font-size: 18px; line-height: 1.55; font-weight: 500; max-width: 480px; padding-top: 38px; }
		.about-copy p { margin: 0 0 28px; }
		.text-link { border-bottom: 1px solid var(--ink); display: inline-block; font-family: var(--mono); font-size: 11px; letter-spacing: .08em; padding-bottom: 5px; text-transform: uppercase; }

		.contact { background-image: linear-gradient(rgba(29, 29, 27, .1), rgba(29, 29, 27, .1)), url("images/Final projects photos/background style .jpg"); background-position: center; background-size: cover; color: var(--cream); padding: 100px 5vw 34px; }
		.contact h2 { font-family: var(--serif); font-size: clamp(52px, 9vw, 130px); font-weight: 600; letter-spacing: -.06em; line-height: .87; margin: 18px 0 70px; max-width: 850px; }
		.contact-row { align-items: end; border-top: 1px solid rgba(250,248,242,.45); display: flex; justify-content: space-between; padding-top: 22px; }
		.contact-row a { border-bottom: 1px solid rgba(250,248,242,.7); font-family: var(--mono); font-size: 12px; padding-bottom: 4px; }
		.contact-row small { font-family: var(--mono); font-size: 10px; text-transform: uppercase; }

		@media (max-width: 720px) {
			.site-header { gap: 12px; padding: 22px 5vw 18px; }
			.wordmark { transform: translateY(-3px); width: clamp(240px, 68vw, 340px); }
			.nav { font-size: 10px; gap: 10px 16px; letter-spacing: .1em; width: 100%; }
			.hero { min-height: 75vh; padding-top: 14vh; }
			.hero-bottom, .section-heading, .contact-row { align-items: start; flex-direction: column; gap: 24px; }
			.hero-links { justify-content: flex-start; }
			.scroll-note { display: none; }
			.work { padding: 72px 5vw 80px; }
			.filters { justify-content: start; }
			.project, .project:nth-child(2), .project:nth-child(3), .project:nth-child(5), .project:nth-child(6) { grid-column: span 12; }
			.project:nth-child(n) .project-image { aspect-ratio: 4 / 3; }
			.about { gap: 20px; grid-template-columns: 1fr; padding: 76px 5vw; }
			.about-copy { padding-top: 0; }
			.contact { padding-top: 78px; }
			.contact h2 { margin-bottom: 66px; }
		}
	</style>
</head>
<body>
	<header class="site-header">
		<a class="wordmark" href="#top"><img class="brand-logo" src="images/log new version gold triangle 3 of 3 .png" alt="Adriana Elzarraraz"></a>
		<nav class="nav" aria-label="Main navigation">
			<a href="about.html">About</a>
			<a href="design.html">Design</a>
			<a href="contact.html">Contact</a>
		</nav>
	</header>

	<main id="top">
		<section class="hero">
			<div class="eyebrow">Graphic Designer and Media Arts</div>
			<h1>Ideas with<br><em>character.</em></h1>
			<div class="hero-bottom">
				<p class="hero-intro">I make identities, digital experiences, printed things, and functional websites for people building a more interesting world.</p>
				<div class="hero-links">
					<a class="text-link" href="about.html">About</a>
					<a class="text-link" href="Documents/Resume%20web.pdf" target="_blank" rel="noopener">Resume</a>
					<a class="text-link" href="contact.html">Start a conversation</a>
				</div>
				<span class="scroll-note">Explore the work</span>
			</div>
		</section>

	</main>

</body>
</html>
